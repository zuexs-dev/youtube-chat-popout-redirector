# Example nginx vhost for ytchat behind TLS.
# Replace ytchat.example.com, the certificate paths and the upstream address.
server {
    listen 443 ssl;
    server_name ytchat.example.com;

    ssl_certificate     /etc/letsencrypt/live/ytchat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ytchat.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
